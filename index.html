<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>욱's 출근 체크</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1D2633">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="욱's">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --app:#F2F4F7;--surface:#FFFFFF;--ink:#151B24;--muted:#5E6878;--line:#DCE1E8;--brand:#1D2633;--brand-fg:#FFFFFF;--accent:#2F6FF0;
  --ready:#7C8697;--ready-bg:#EBEEF2;--go:#1F5FE0;--go-bg:#E2EBFD;--ok:#11845A;--ok-bg:#DFF2E8;--late:#D02B1F;--late-bg:#FCE5E2;--warn:#B85A08;--warn-bg:#FCEBD5;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --app:#0F131A;--surface:#171D26;--ink:#E7ECF3;--muted:#98A2B3;--line:#2A323E;--brand:#E7ECF3;--brand-fg:#11161D;--accent:#6E9BFF;
  --ready:#9AA4B4;--ready-bg:#222A35;--go:#6E9BFF;--go-bg:#16264A;--ok:#4CC995;--ok-bg:#12301F;--late:#FF6B5E;--late-bg:#3A1714;--warn:#F5A35B;--warn-bg:#3A2610;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--app);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,time{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;min-height:100vh}
.hdr{position:sticky;top:0;z-index:4;background:var(--app);display:flex;align-items:center;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
.hdr h2{margin:0;font-size:22px;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .who{font-size:13px;color:var(--muted)}
.back{border:0;background:var(--surface);width:36px;height:36px;border-radius:10px;font-size:20px;line-height:1;display:grid;place-items:center;flex:none}
.logo{height:34px;padding:0 8px;border-radius:9px;background:var(--brand);color:var(--brand-fg);display:inline-flex;align-items:center;font-weight:700;font-size:15px;letter-spacing:-.02em;white-space:nowrap;flex:none}
.logoimg{width:34px;height:34px;border-radius:9px;flex:none}
.logo i{font-style:normal;color:var(--accent);font-size:11px;margin-left:1px}
.main{padding:2px max(16px,env(safe-area-inset-right)) calc(100px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:12px}
.main>*{flex:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
.tabbar nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:11px;font-weight:600}
.tabbar button svg{width:23px;height:23px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar .dotn{position:relative}.tabbar .dotn::after{content:"";position:absolute;top:-1px;right:-4px;width:8px;height:8px;border-radius:50%;background:var(--late)}

.sec-t{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px -2px}
.sec-t h3{margin:0;font-size:15px}
.link{font-size:13px;color:var(--accent);background:none;border:0;padding:0;font-weight:600}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.muted{color:var(--muted)}.small{font-size:13px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:16px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.err{margin:16px;padding:14px;border-radius:12px;background:var(--late-bg);color:var(--late);font-weight:600}

.hero{border-radius:20px;padding:18px;background:var(--brand);color:var(--brand-fg);display:flex;flex-direction:column;gap:12px}
.hero .lbl{font-size:12px;opacity:.7;font-weight:600}
.hero .site{font-size:20px;font-weight:700;letter-spacing:-.01em}
.hero .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hero .cell{background:rgba(128,128,128,.16);border-radius:12px;padding:8px 10px}
.hero .cell b{display:block;font-family:var(--f-mono);font-size:20px}
.hero .cta{border:0;border-radius:12px;padding:12px;background:var(--accent);color:#fff;font-weight:700;font-size:15px}

.todo{list-style:none;margin:0;padding:0}
.todo li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.todo li:last-child{border-bottom:0}
.chk{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:#fff}
.chk.done{background:var(--ok);border-color:var(--ok)}
.todo .t{font-weight:600}.todo time{color:var(--muted);font-size:13px}

.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--c);color:var(--surface);white-space:nowrap}
.s-ready{--c:var(--ready);--cb:var(--ready-bg)}.s-departed{--c:var(--go);--cb:var(--go-bg)}.s-arrived,.s-confirmed{--c:var(--ok);--cb:var(--ok-bg)}
.s-late,.s-late10{--c:var(--late);--cb:var(--late-bg)}.s-delayed{--c:var(--warn);--cb:var(--warn-bg)}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .ttl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.chev{color:var(--muted);font-size:18px}
.dbox{width:48px;text-align:center;border-radius:10px;background:var(--app);padding:4px 0;line-height:1.2}
.dbox b{display:block;font-size:17px}.dbox small{font-size:11px;color:var(--muted)}
.avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;background:var(--cb,var(--ready-bg));color:var(--c,var(--ink))}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--go-bg);color:var(--go);white-space:nowrap}
.badge.off{background:var(--late-bg);color:var(--late)}.badge.ok{background:var(--ok-bg);color:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kpi b{display:block;font-family:var(--f-mono);font-size:24px;color:var(--c,var(--ink))}
.kpi span{font-size:12px;color:var(--muted);font-weight:600}

.card{border-radius:16px;padding:14px;background:var(--cb);border:1.5px solid transparent;display:flex;flex-direction:column;gap:10px}
.card.s-late,.card.s-late10,.card.s-delayed{border-color:var(--c)}.card.s-confirmed{border:2px solid var(--ok)}
.card.s-late10{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(208,43,31,.45)}50%{box-shadow:0 0 0 6px rgba(208,43,31,0)}}
@media (prefers-reduced-motion:reduce){.card.s-late10{animation:none}}
.card .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .head b{font-size:18px;min-width:0;overflow-wrap:anywhere}
.times{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0}
.times div{background:var(--surface);border-radius:10px;padding:7px 10px}
.box .times div{background:var(--app)}
.times dt{font-size:11px;color:var(--muted)}
.times dd{margin:0;font-family:var(--f-mono);font-weight:600;font-size:18px}
.noterow{display:flex;justify-content:space-between;align-items:center;gap:6px 10px;flex-wrap:wrap}
.note{margin:0;font-size:13px;font-weight:600;color:var(--c)}
.gap{font-size:12px;color:var(--muted);background:var(--surface);border-radius:99px;padding:2px 10px;white-space:nowrap}
.gap b{color:var(--ink)}
.psum{font-size:12.5px;color:var(--muted);background:var(--surface);border-radius:10px;padding:7px 10px}
.psum b{color:var(--ink);font-family:var(--f-mono)}
.psum .mg{margin-top:3px;font-weight:700;color:var(--ok)}.psum .mg.bad{color:var(--late)}

.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.pgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.pgrid .full{grid-column:1/-1}
.pgrid input,.pgrid select,.pgrid textarea{width:100%;min-width:0;max-width:100%;display:block;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--app);font-size:16px;-webkit-appearance:none;appearance:none;min-height:44px;text-align:left;color:var(--ink)}
.pgrid input[type=time],.pgrid input[type=number],.pgrid input[type=date]{font-family:var(--f-mono)}
.pgrid input::-webkit-date-and-time-value{text-align:left}
.pgrid textarea{min-height:70px;resize:vertical}
.pgrid input:disabled{opacity:.7}
.margin{margin:0;padding:8px 10px;border-radius:10px;background:var(--ok-bg);color:var(--ok);font-weight:700;font-size:14px;text-align:center}
.margin.bad{background:var(--late-bg);color:var(--late)}
.big{width:100%;padding:16px;border-radius:14px;border:0;font-size:17px;font-weight:700;color:#fff}
.big.go{background:var(--go)}.big.ok{background:var(--ok)}.big.warn{background:var(--warn)}.big.dark{background:var(--brand);color:var(--brand-fg)}
.big.line{background:var(--surface);color:var(--late);border:1.5px solid var(--late)}
.big:disabled{opacity:.35;cursor:default}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.delays{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.delays button{padding:13px 0;border-radius:12px;border:2px solid var(--warn);background:var(--surface);color:var(--warn);font-weight:700}
.linkish{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;align-self:center}
.locked{margin:0;padding:10px 12px;border-radius:12px;background:var(--ok-bg);color:var(--ok);font-weight:600;font-size:14px;text-align:center}

.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:44px 14px minmax(0,1fr);gap:8px;align-items:start;font-size:13.5px;padding-bottom:10px;position:relative}
.tl li:not(:last-child)::after{content:"";position:absolute;left:57px;top:15px;bottom:-1px;width:2px;background:var(--line)}
.tl time{font-weight:600}
.tl i{width:10px;height:10px;border-radius:50%;background:var(--tc,var(--ready));margin-top:5px}
.tl .go{--tc:var(--go)}.tl .ok{--tc:var(--ok)}.tl .warn{--tc:var(--warn)}.tl .bad{--tc:var(--late)}
.tl em{font-style:normal;color:var(--muted)}

.dates{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.dates button{flex:none;width:52px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 0;line-height:1.25}
.dates button small{display:block;font-size:11px;color:var(--muted)}
.dates button b{font-size:17px}
.dates button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.dates button[aria-pressed="true"] small{color:inherit;opacity:.7}
.dates .dot{display:block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin:2px auto 0}
.dates .nodot{display:block;height:7px}
.fab{border:0;border-radius:14px;padding:13px;background:var(--brand);color:var(--brand-fg);font-weight:700}

.sheet-bg{position:fixed;inset:0;background:rgba(10,14,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{width:100%;max-width:640px;max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px max(16px,env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:12px}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);align-self:center}
.sheet h3{margin:0;font-size:18px}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.feed li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:10px 12px;border-radius:12px;background:var(--cb);font-size:13px}
.feed time{font-weight:600;color:var(--c)}
.info{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px 10px;font-size:14px;margin:0}
.info dt{color:var(--muted);font-size:13px}.info dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.info a{color:var(--accent)}
.pushbar{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13.5px;line-height:1.45}
.pushbar.on{background:var(--go-bg);color:var(--go);border-color:transparent;font-weight:600}
.btn-push{background:var(--go);color:#fff;border:0;font-weight:700;font-size:16px;text-align:center}
.btn-push small{display:block;font-weight:500;font-size:12px;opacity:.85}
.busy{opacity:.6;pointer-events:none}
#toasts{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:20;align-items:center;pointer-events:none}
.toast{background:var(--brand);color:var(--brand-fg);padding:11px 14px;border-radius:12px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.18);max-width:520px;text-align:center}
.toast.alert{background:var(--late);color:#fff}
.ver{font-size:11px;color:var(--muted);text-align:center;margin:8px 0 0}
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--app);transition:opacity .35s ease}
#splash img{width:112px;height:112px;border-radius:26px;box-shadow:0 14px 40px rgba(47,90,220,.22)}
#splash b{font-size:26px;font-weight:700;letter-spacing:.06em;color:var(--ink)}
#splash.hide{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:no-preference){
  #splash img{animation:pop .55s cubic-bezier(.2,.9,.3,1.2) both}
  #splash b{animation:rise .5s .15s ease-out both}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
  @keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
}
.ver-old{font-size:11px;color:var(--muted);text-align:center;margin:8px 0 0}
</style>
</head>

<script>
// 구글 Apps Script 웹앱 주소 (데이터 서버)
var API_URL = "https://script.google.com/macros/s/AKfycbzwTOwgYY2BSMt4WpZY8L1OmP7Hz4rHeXQeXuTMGKtfLmxOF-EAQitmsO6sC6c5wyVs/exec";
var VERSION = 'v1.0';
var LOGO = document.querySelector('#splash img').getAttribute('src');   // 로고는 파일에 내장 (아이콘 파일이 없어도 보이게)
var QS = new URLSearchParams(location.search);
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var MODE = QS.get('admin') ? 'admin' : (QS.get('k') ? 'staff' : (lsGet('uk-mode') || 'staff'));
var KEY = (QS.get('admin') || QS.get('k') || lsGet('uk-key') || '').replace(/[^A-Za-z0-9]/g,'');
if (QS.get('admin') || QS.get('k')) { lsSet('uk-mode', MODE); lsSet('uk-key', KEY); }

var S = {data:null, sched:null, schedDate:null, page:'home', sub:null, busy:false, planDirty:false, showDelay:false, sheet:null, seen:null, sound:false};
var audio = null;

/* ---------- 공통 ---------- */
function $(id){return document.getElementById(id)}
// 스플래시: 최소 0.9초 보여 주고, 첫 화면이 그려지면 사라짐 (최대 6초)
var SPLASH_T0=Date.now();
function hideSplash(){var el=$('splash');if(!el||el.classList.contains('hide'))return;setTimeout(function(){el.classList.add('hide');setTimeout(function(){el.remove()},400)},Math.max(0,900-(Date.now()-SPLASH_T0)))}
setTimeout(hideSplash,6000);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return String(n).padStart(2,'0')}
function toM(t){var m=String(t||'').match(/(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):null}
function hm(m){m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)}
function addMin(t,m){var a=toM(t);if(a==null||m===''||isNaN(+m))return '';return hm(a+ +m)}
function dur(m){m=Math.abs(m);var h=Math.floor(m/60),r=m%60;return (h?h+'시간':'')+(h&&r?' ':'')+(r||!h?r+'분':'')}
function addDay(k,n){var p=k.split('-').map(Number);var d=new Date(p[0],p[1]-1,p[2]+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function wd(k){var p=k.split('-').map(Number);return '일월화수목금토'.charAt(new Date(p[0],p[1]-1,p[2]).getDay())}
function md(k){var p=k.split('-').map(Number);return p[1]+'/'+p[2]}
function initial(n){n=String(n||'');return n.length>1?n.charAt(n.length-2):n}
function diffText(at,by){var a=toM(at),b=toM(by);if(a==null||b==null)return '';var d=a-b;return d>0?d+'분 늦음':d<0?(-d)+'분 일찍':'정시'}
function skey(k){return k==='late10'?'late':k}

function call(fn,args,done){
  if(!KEY){S.busy=false;done({error:'개인 링크로 한 번 열어 주세요. 관리자에게 받은 링크를 누르면 됩니다.'});return}
  fetch(API_URL,{method:'POST',body:JSON.stringify({fn:fn,args:args})})
    .then(function(r){return r.json()})
    .then(function(res){S.busy=false;done(res)})
    .catch(function(){S.busy=false;$('app').classList.remove('busy');hideSplash();toast('서버 연결 오류: 인터넷 연결을 확인해 주세요.')});
}
function toast(t,alert){var el=document.createElement('div');el.className='toast'+(alert?' alert':'');el.innerHTML=t;$('toasts').appendChild(el);setTimeout(function(){el.remove()},alert?8000:3000)}
function beep(){if(!S.sound||!audio)return;try{var o=audio.createOscillator(),g=audio.createGain();o.frequency.value=880;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.2,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.6);o.start();o.stop(audio.currentTime+.6)}catch(e){}}

/* ---------- 라우팅 (#page 또는 #page/sub) ---------- */
var TABS={staff:[['home','홈'],['checkin','출근 등록'],['schedule','일정'],['me','내 정보']],
          admin:[['home','홈'],['status','현황'],['schedule','일정 관리'],['staff','직원']]};
var TITLE={staff:{home:'홈',checkin:'출근 등록',schedule:'일정',me:'내 정보'},admin:{home:'오늘 현황',status:'현황',schedule:'일정 관리',staff:'직원'}};
function readHash(){var h=decodeURIComponent(location.hash.slice(1)).split('/');var ok=TABS[MODE].some(function(t){return t[0]===h[0]});S.page=ok?h[0]:'home';S.sub=ok&&h[1]?h.slice(1).join('/'):null}
function go(page,sub){var h='#'+page+(sub?'/'+encodeURIComponent(sub):'');if(location.hash!==h)location.hash=h;else route()}
function route(){readHash();S.showDelay=false;if(MODE==='admin'&&S.page==='schedule')ensureSched();render();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);

/* ---------- 카드·이력 조각 ---------- */
function note(s){
  if(s.key==='confirmed') return (s.arrAt?s.arrAt+' 도착 · ':'')+s.confirmed+' 출근 확인 완료';
  if(s.key==='arrived') return s.arrAt+' 현장 도착';
  if(s.key==='late'||s.key==='late10') return (s.delay?'지연 신고 반영 '+s.eta+' 기준 ':'기준 시각에서 ')+s.over+'분 지남'+(s.key==='late10'?' · 2차 알림':'');
  if(s.key==='delayed') return s.delay+'분 지연 신고 · 도착 예정 '+s.eta+(s.left!=null?' ('+s.left+'분 남음)':'');
  if(s.key==='departed') return s.depAt+' 출발'+(s.left!=null?' · 도착까지 '+s.left+'분':'');
  return s.left!=null?(s.left>=0?'식장 도착까지 '+dur(s.left):'출발 전'):'시간 미입력';
}
function gapHTML(s){var a=toM(s.depBy),b=toM(s.arrBy);if(a==null||b==null||b<a)return '';return '<span class="gap">식장 도착 → 식 <b>'+dur(b-a)+'</b></span>'}
function card(s,showName){
  return '<article class="card s-'+s.key+'"><div class="head"><b>'+(showName?esc(s.name)+' · ':'')+(esc(s.site)||'현장 미입력')+'</b><span class="pill">'+esc(s.label)+'</span></div>'+
    '<dl class="times"><div><dt>식장 도착 시간</dt><dd>'+(esc(s.depBy)||'--:--')+'</dd></div><div><dt>식 시간</dt><dd>'+(esc(s.arrBy)||'--:--')+'</dd></div></dl>'+
    '<div class="noterow"><p class="note">'+esc(note(s))+'</p>'+gapHTML(s)+'</div></article>';
}
function marginText(by,arr){var a=toM(by),b=toM(arr);if(a==null||b==null)return {text:'',late:false};var d=a-b;return d>=0?{text:'식장 도착 시간까지 여유 '+d+'분',late:false}:{text:'식장 도착 시간보다 '+(-d)+'분 늦게 도착 예정',late:true}}
function planSum(s){
  var p=s.plan||{};
  if(!p.prep&&!p.dep&&!p.move&&!p.arr) return '<div class="psum">작가 계획 미입력</div>';
  var mg=marginText(s.depBy,p.arr);
  return '<div class="psum">계획 · 준비 <b>'+(esc(p.prep)||'-')+'</b> · 출발 <b>'+(esc(p.dep)||'-')+'</b> · 이동 <b>'+(p.move?esc(p.move)+'분':'-')+'</b> · 도착 <b>'+(esc(p.arr)||'-')+'</b>'+
    (mg.text?'<div class="'+(mg.late?'mg bad':'mg')+'">'+esc(mg.text)+'</div>':'')+'</div>';
}
function timeline(s){
  var ev=[];
  function alerts(str,ph){String(str||'').split('/').forEach(function(x){var m=x.match(/(1차|2차)\s*(\d{1,2}:\d{2})/);if(m)ev.push({t:m[2],c:'bad',x:ph+' 지연 '+m[1]+' 알림'})})}
  if(s.plan&&s.plan.at){var pm=String(s.plan.at).match(/(\d{1,2}:\d{2})/);if(pm)ev.push({t:pm[1],c:'',x:'계획 입력',sub:'출발 '+(s.plan.dep||'-')+' · 도착 '+(s.plan.arr||'-')})}
  if(s.depAt) ev.push({t:s.depAt,c:'go',x:'출발'});
  alerts(s.depAlert,'출발');
  String(s.delayNote||'').split('/').forEach(function(x){var m=x.match(/(\d{1,2}:\d{2})\s*\+(\d+)분/);if(m)ev.push({t:m[1],c:'warn',x:'도착 '+m[2]+'분 지연 신고'})});
  alerts(s.arrAlert,'도착');
  if(s.arrAt) ev.push({t:s.arrAt,c:'ok',x:'현장 도착',sub:'식장 도착 시간 대비 '+diffText(s.arrAt,s.depBy)});
  if(s.confirmed) ev.push({t:s.confirmed,c:'ok',x:'관리자 출근 확인'});
  if(!ev.length) return '<p class="small muted" style="margin:0">아직 기록이 없습니다.</p>';
  ev.sort(function(a,b){return toM(a.t)-toM(b.t)});
  return '<ol class="tl">'+ev.map(function(e){return '<li class="'+e.c+'"><time>'+esc(e.t)+'</time><i></i><span>'+esc(e.x)+(e.sub?' <em>'+esc(e.sub)+'</em>':'')+'</span></li>'}).join('')+'</ol>';
}
function infoHTML(info){
  info=info||{};

  return '<div class="box"><b>현장 정보</b><dl class="info">'+
    (info.addr?'<dt>주소</dt><dd>'+esc(info.addr)+'<br><a href="https://map.naver.com/p/search/'+encodeURIComponent(info.addr)+'" target="_blank" rel="noopener">네이버 지도</a> · <a href="https://map.kakao.com/link/search/'+encodeURIComponent(info.addr)+'" target="_blank" rel="noopener">카카오맵</a></dd>':'')+
    (info.park?'<dt>주차</dt><dd>'+esc(info.park)+'</dd>':'')+

function openSheet(row){

  S.sheet=s?{row:s.row,date:d.date,name:s.name,site:s.site,depBy:s.depBy,arrBy:s.arrBy,addr:(s.info||{}).addr||'',park:(s.info||{}).park||'',contact:(s.info||{}).contact||'',memo:(s.info||{}).memo||'',hasRecord:!!(s.depAt||s.arrAt)}
    :{date:S.schedDate||S.data.today,name:'',site:'',depBy:'',arrBy:'',addr:'',park:'',contact:'',memo:''};

}

function sheetValues(){var g=function(id){var el=$('f-'+id);return el?el.value.trim():''};return {row:S.sheet.row||'',date:g('date'),name:g('name'),site:g('site'),depBy:g('depBy'),arrBy:g('arrBy'),addr:g('addr'),park:g('park'),contact:g('contact'),memo:g('memo')}}

/* ---------- 관리자 전환 (비밀번호) ---------- */

  $('sheet').innerHTML='<div class="sheet-bg" data-close><div class="sheet" role="dialog" aria-label="관리자 비밀번호"><span class="grab"></span><h3>관리자 화면</h3>'+

   '<div class="pgrid"><label class="full">비밀번호<input type="password" id="pw" inputmode="numeric" autocomplete="off" maxlength="20" style="font-family:var(--f-mono);font-size:22px;letter-spacing:.3em;text-align:center"></label></div>'+
   (msg?'<p class="margin bad" style="margin:0">'+esc(msg)+'</p>':'')+
   '<button class="big dark" data-pw-ok>확인</button><button class="linkish" data-close-btn>닫기</button></div></div>';

function toAdmin(adminKey){
  S.staffKey=KEY; KEY=adminKey; MODE='admin';
  S.data=null; S.sched=null; S.schedDate=null; S.seen=null; S.planDirty=false; S.busy=false;
  $('app').innerHTML='<div class="empty" style="margin:16px"><b>관리자 화면을 여는 중</b>잠시만 기다려 주세요.</div>';
  S.page='home'; S.sub=null; location.hash='#home'; loadBoard();
}
function toStaff(){
  KEY=S.staffKey; S.staffKey=null; MODE='staff';
  S.data=null; S.sched=null; S.sheet=null; S.busy=false; renderSheet();
  $('app').innerHTML='<div class="empty" style="margin:16px"><b>작가 화면으로 돌아가는 중</b>잠시만 기다려 주세요.</div>';
  S.page='me'; S.sub=null; location.hash='#me'; loadStaff();
}
document.addEventListener('click',function(e){
  if(e.target.closest('[data-admin-login]')){renderPw('');return}
  if(e.target.closest('[data-to-staff]')){toStaff();return}
  if(e.target.closest('[data-pw-ok]')){submitPw();return}
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='pw'){e.preventDefault();submitPw()}});
function submitPw(){
  var v=($('pw')||{}).value||''; if(!v) return;
  var btn=document.querySelector('[data-pw-ok]'); if(btn){btn.disabled=true;btn.textContent='확인 중…'}
  fetch(API_URL,{method:'POST',body:JSON.stringify({fn:'apiAdminLogin',args:[KEY,v]})}).then(function(r){return r.json()}).then(function(res){
    if(res&&res.ok){S.pw=false;$('sheet').innerHTML='';toast('관리자 화면으로 전환했어요.');toAdmin(res.adminKey)}
    else renderPw((res&&res.msg)||'비밀번호가 맞지 않습니다.');
  }).catch(function(){renderPw('서버 연결 오류: 잠시 후 다시 시도해 주세요.')});
}

/* ---------- 렌더 ---------- */
function editing(){var a=document.activeElement;return S.sheet||S.planDirty||(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)&&$('app').contains(a))}
function render(force){
  if(!S.data) return;
  hideSplash();
  if(!force&&editing()) return;
  var P=MODE==='admin'?ADMIN:STAFF, T=TITLE[MODE][S.page];
  var title=S.sub?(MODE==='admin'?(S.page==='status'?'직원 상세':T):'일정 상세'):T;
  var lead=S.sub?'<button class="back" data-back aria-label="뒤로">‹</button>':'<img class="logoimg" src="'+LOGO+'" alt="욱\'s">';
  var who=!S.sub?(MODE==='admin'&&S.staffKey?'<button class="badge" style="border:0;padding:6px 10px;font-size:12px" data-to-staff>작가 화면으로</button>':'<span class="who">'+(MODE==='admin'?'관리자 · '+esc(S.data.now):esc(S.data.name)+' 작가 · '+esc(S.data.now))+'</span>'):'';
  var lateN=MODE==='admin'?S.data.shifts.filter(function(s){return /late/.test(s.key)}).length:0;
  $('app').innerHTML='<header class="hdr">'+lead+'<h2>'+esc(title)+'</h2>'+who+'</header><main class="main">'+P[S.page](S.data)+'</main>'+

/* ---------- 데이터 불러오기 ---------- */
function loadStaff(){if(S.busy)return;S.busy=true;call('apiStaff',[KEY],onStaff)}
function onStaff(d){
  $('app').classList.remove('busy');
  if(d.error){hideSplash();$('app').innerHTML='<div class="err">'+esc(d.error)+'</div>';return}
  S.data=d; if(d.notice) toast(esc(d.notice));
  if(d.pushAppId) initPush(d.pushAppId);
  render();
}
function loadBoard(){if(S.busy)return;S.busy=true;call('apiBoard',[KEY,''],onBoard)}
function onBoard(d){
  $('app').classList.remove('busy');
  if(d.error){hideSplash();$('app').innerHTML='<div class="err">'+esc(d.error)+'</div>';return}
  if(d.date!==d.today){ S.sched=d; if(d.notice) toast(esc(d.notice)); render(); return; }   // 일정 관리 탭에서 다른 날짜를 연 경우
  var ids=d.alerts.map(function(a){return a.at+a.name+a.stage+a.text});
  if(S.seen){d.alerts.forEach(function(a,i){if(S.seen.indexOf(ids[i])<0&&a.stage!=='푸시 설정'){toast('<b>'+esc(a.name)+'</b> '+esc(a.text),a.stage!=='지연 신고');beep()}})}
  S.seen=ids; S.data=d; if(!S.schedDate||S.schedDate===d.today) S.sched=d;
  if(d.notice) toast(esc(d.notice));
  if(d.pushAppId) initPush(d.pushAppId);
  render();
}
function ensureSched(){var sel=S.schedDate||(S.data&&S.data.today);if(!sel||!S.data)return;if(sel===S.data.today){S.sched=S.data;return}if(S.sched&&S.sched.date===sel)return;S.sched=null;call('apiBoard',[KEY,sel],onBoard)}

/* ---------- 이벤트 ---------- */
document.addEventListener('click',function(e){
  var t=e.target;
  // 일정 추가·수정 창
  if(t.closest('[data-close-btn]')||(t.hasAttribute&&t.hasAttribute('data-close'))){S.sheet=null;S.pw=false;renderSheet();render(true);return}
  if(t.closest('[data-save]')){var v=sheetValues();
    if(!v.date||!v.name||!v.depBy){toast('날짜, 작가, 식장 도착 시간은 꼭 입력해 주세요.',true);return}
    S.sheet=null;renderSheet();S.schedDate=v.date;$('app').classList.add('busy');call('apiSaveShift',[KEY,v],function(d){S.sched=d;onBoard(d);if(d.date===d.today)S.sched=d;$('app').classList.remove('busy');render(true)});return}
  if(t.closest('[data-del]')){if(!S.sheet.confirmDel){S.sheet.confirmDel=true;renderSheet();return}
    var f=S.sheet;S.sheet=null;renderSheet();$('app').classList.add('busy');call('apiDeleteShift',[KEY,f.row,f.date,f.name],function(d){onBoard(d);$('app').classList.remove('busy');render(true)});return}
  if(t.closest('[data-new]')){openSheet(null);return}
  var ed=t.closest('[data-edit]'); if(ed){openSheet(ed.dataset.edit);return}
  // 이동
  if(t.closest('[data-back]')){if(history.length>1)history.back();else go(S.page);return}
  var tb=t.closest('[data-tab]'); if(tb){S.planDirty=false;go(tb.dataset.tab);return}
  var g=t.closest('[data-go]'); if(g){go(g.dataset.go,g.dataset.sub);return}
  var sb=t.closest('[data-sub]'); if(sb){go(S.page,sb.dataset.sub);return}
  var dt=t.closest('[data-date]'); if(dt){S.schedDate=dt.dataset.date;ensureSched();render(true);return}
  var cp=t.closest('[data-copy]'); if(cp){var s=S.data.staff[+cp.dataset.copy];if(navigator.clipboard)navigator.clipboard.writeText(s.link).then(function(){toast(esc(s.name)+' 링크를 복사했어요.')},function(){prompt('복사해 주세요',s.link)});else prompt('복사해 주세요',s.link);return}
  if(t.id==='sound'){S.sound=!S.sound;if(S.sound&&!audio){try{audio=new (window.AudioContext||window.webkitAudioContext)()}catch(err){}}render(true);return}
  // 계획 저장
  var sp=t.closest('[data-save-plan]');
  if(sp){var plan=planOf(sp.dataset.savePlan);
    $('app').classList.add('busy');S.busy=true;call('apiPlan',[KEY,sp.dataset.savePlan,plan],function(d){S.planDirty=false;S.planRow=null;if(document.activeElement)document.activeElement.blur();onStaff(d)});return}
  if(t.closest('[data-toggle-delay]')){S.showDelay=true;render(true);return}
  // 출발·도착·지연·확인 버튼
  var a=t.closest('[data-a]');
  if(a){
    S.showDelay=false;$('app').classList.add('busy');S.busy=true;
    if(MODE==='admin'){call('apiAdminPress',[KEY,a.dataset.r,a.dataset.a,''],onBoard);return}
    if(S.planDirty&&a.dataset.a==='depart'&&String(S.planRow)===String(a.dataset.r)&&$('pp-dep-'+a.dataset.r)){
      var plan2=planOf(a.dataset.r);
      call('apiPlan',[KEY,a.dataset.r,plan2],function(){S.planDirty=false;S.busy=true;call('apiPress',[KEY,a.dataset.r,'depart'],onStaff)});
    } else call('apiPress',[KEY,a.dataset.r,a.dataset.a],function(d){S.planDirty=false;onStaff(d)});
  }
});
document.addEventListener('input',function(e){
  var box=e.target.closest('[data-plan]'); if(!box) return;
  var r=box.dataset.plan; S.planDirty=true; S.planRow=r;
  if(/^pp-(dep|move)-/.test(e.target.id)){var v=addMin($('pp-dep-'+r).value,$('pp-move-'+r).value);if(v)$('pp-arr-'+r).value=v}
  var w=$('pp-margin-'+r);if(w){var mg=marginText(w.dataset.by,$('pp-arr-'+r).value);w.textContent=mg.text;w.hidden=!mg.text;w.classList.toggle('bad',!!mg.late)}
});
document.addEventListener('change',function(e){if(e.target.id==='pick-date'&&e.target.value){S.schedDate=e.target.value;e.target.blur();ensureSched();render(true)}});

/* ---------- 폰 푸시 알림 (OneSignal) ---------- */
var PUSH={inited:false,state:'none',os:null};
function isIOS(){return /iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}
function isStandalone(){return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true}
function initPush(appId){
  if(PUSH.inited) return; PUSH.inited=true;
  if(isIOS()&&!isStandalone()){PUSH.state='ios-browser';reportPush();return}
  if(!('Notification' in window)||!('serviceWorker' in navigator)){PUSH.state='unsupported';reportPush();return}
  PUSH.state='loading';
  window.OneSignalDeferred=window.OneSignalDeferred||[];
  var sc=document.createElement('script');sc.src='https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js';sc.defer=true;document.head.appendChild(sc);
  OneSignalDeferred.push(async function(OneSignal){
    try{
      var base=location.pathname.replace(/[^\/]*$/,'');
      await OneSignal.init({appId:appId,serviceWorkerPath:base.slice(1)+'OneSignalSDKWorker.js',serviceWorkerParam:{scope:base}});
      PUSH.os=OneSignal;
      if(OneSignal.Notifications.permission){await OneSignal.login(KEY);PUSH.state='on'}
      else PUSH.state=(window.Notification&&Notification.permission==='denied')?'denied':'off';
    }catch(err){PUSH.state='error'}
    reportPush(); render();
  });
}
function reportPush(){
  var key='uk-push-reported-'+KEY, st=PUSH.state;
  if(MODE==='admin'||!KEY||!st||st==='none'||st==='loading'||lsGet(key)===st) return;
  fetch(API_URL,{method:'POST',body:JSON.stringify({fn:'apiPushStatus',args:[KEY,st]})}).then(function(){lsSet(key,st)}).catch(function(){});
}
function pushHTML(){
  var st=PUSH.state, adm=MODE==='admin';
  if(adm&&S.staffKey) return '';   // 작가 앱에서 비밀번호로 들어온 관리자 화면에서는 알림 설정을 보여 주지 않음
  if(st==='none'||st==='loading') return '';
  if(st==='on') return '<div class="pushbar on">🔔 알림 켜짐 · '+(adm?'출발·지연·도착 소식을 알려 드려요':'일정 전과 확인이 필요할 때 알려 드려요')+'</div>';
  if(st==='off') return '<button class="pushbar btn-push" data-push>🔔 알림 켜기 <small>'+(adm?'작가 출발·지연·도착을 폰으로 받아요':'일정 전에 폰으로 알려 드려요')+'</small></button>';
  if(st==='ios-browser') return '<div class="pushbar">아이폰은 <b>홈 화면에 추가한 앱</b>에서만 알림을 받을 수 있어요. Safari 공유 버튼 → 홈 화면에 추가 후, 그 앱을 열어 알림을 켜 주세요.</div>';
  if(st==='denied') return '<div class="pushbar">알림이 차단돼 있어요. 휴대폰 설정 → 알림에서 이 앱(또는 브라우저)의 알림을 허용해 주세요.</div>';
  if(st==='unsupported') return '<div class="pushbar">이 브라우저는 알림을 지원하지 않아요. 크롬이나 Safari(홈 화면 앱)를 이용해 주세요.</div>';
  return '<div class="pushbar">알림 설정을 불러오지 못했어요. 잠시 후 다시 열어 주세요.</div>';
}
document.addEventListener('click',async function(e){
  if(!e.target.closest('[data-push]')||!PUSH.os) return;
  try{
    await PUSH.os.Notifications.requestPermission();
    if(PUSH.os.Notifications.permission){await PUSH.os.login(KEY);PUSH.state='on';toast('알림을 켰어요.')}
    else PUSH.state='denied';
  }catch(err){PUSH.state='error'}
  reportPush(); render(true);
});

/* ---------- 시작 ---------- */
readHash();
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){S.busy=false;MODE==='admin'?loadBoard():loadStaff()}});
function tick(){if(MODE==='admin'){loadBoard();if(S.page==='schedule'&&S.schedDate&&S.data&&S.schedDate!==S.data.today&&!S.sheet)call('apiBoard',[KEY,S.schedDate],onBoard)}else loadStaff()}
MODE==='admin'?loadBoard():loadStaff();
setInterval(tick,25000);
</script>
